name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 지원 하한(3.12)과 최신 안정판
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: scripts/verify.sh
