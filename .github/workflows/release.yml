name: Release

# 태그 <패키지 폴더 이름>-v<버전>을 push하면 그 패키지의 GitHub Release를 만든다. 예: http-utils-v0.1.0
# 서비스는 이 태그를 git 의존성으로 설치한다(README 「서비스에서 설치하기」).
on:
  push:
    tags: ['*-v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.tag.outputs.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.0'
      - name: 태그가 main에 병합된 커밋인지 확인
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "태그 커밋이 main에 없습니다"; exit 1; }
      - id: tag
        name: 태그와 패키지 버전 대조
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dir="${TAG%-v*}"
          version="${TAG##*-v}"
          test -f "packages/$dir/pyproject.toml" || { echo "packages/$dir 가 없습니다"; exit 1; }
          actual="$(uv version --package "sch0718-$dir" --short)"
          test "$actual" = "$version" || { echo "태그 버전 $version ≠ pyproject 버전 $actual"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - run: uv sync --all-packages --locked
      - run: scripts/verify.sh
      # 그 패키지 하나만 빈 dist/에 빌드한다.
      - run: rm -rf dist && uv build --package "sch0718-${{ steps.tag.outputs.dir }}" --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release 만들기
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag

  # 서비스와 같은 방법(git 의존성)으로 그 태그를 설치해 import해 본다.
  smoke:
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.0'
      - env:
          DIR: ${{ needs.build.outputs.dir }}
          TAG: ${{ github.ref_name }}
        run: |
          cd "$(mktemp -d)"
          uv venv -q --python 3.12
          uv pip install "sch0718-$DIR @ git+https://github.com/$GITHUB_REPOSITORY@$TAG#subdirectory=packages/$DIR"
          .venv/bin/python -c "import sch0718_${DIR//-/_} as m; print('설치 확인:', m.__name__)"
