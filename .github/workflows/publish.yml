name: Publish

# 태그 <패키지 폴더 이름>-v<버전>을 push하면 그 패키지를 PyPI에 발행한다. 예: http-utils-v0.1.0
on:
  push:
    tags: ['*-v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist: ${{ steps.tag.outputs.dist }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.13.0'
      - id: tag
        name: 태그와 패키지 버전 대조
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dir="${TAG%-v*}"
          version="${TAG##*-v}"
          test -f "packages/$dir/pyproject.toml" || { echo "packages/$dir 가 없습니다"; exit 1; }
          actual="$(uv version --package "sch0718-$dir" --short)"
          test "$actual" = "$version" || { echo "태그 버전 $version ≠ pyproject 버전 $actual"; exit 1; }
          echo "dist=sch0718-$dir" >> "$GITHUB_OUTPUT"
      - run: uv sync --all-packages --locked
      - run: scripts/verify.sh
      - run: uv build --package "${{ steps.tag.outputs.dist }}" --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI의 trusted publisher 설정에 같은 환경 이름(pypi)을 적는다.
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.dist }}/
    permissions:
      id-token: write # PyPI trusted publishing(OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
