# 가상 workspace 루트입니다. 발행하는 패키지는 packages/* 아래에 각자 pyproject.toml을 둡니다.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^templates/"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]
