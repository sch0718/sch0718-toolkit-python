# workspace 루트입니다. 발행하지 않습니다(package = false). 발행하는 패키지는 packages/* 아래에 각자 pyproject.toml을 둡니다.
# requires-python을 여기 명시해야 패키지가 없을 때도 실행 중인 Python 버전과 관계없이 lockfile이 같습니다.
[project]
name = "sch0718-toolkit-python-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false
required-version = ">=0.13"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^templates/"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]
